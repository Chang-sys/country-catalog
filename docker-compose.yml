version: '3.8'
services:
  # Development: docker compose up dev
  dev:
    build:
      context: .
      target: development
    container_name: country-catalog-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true

  # Production: docker compose up prod
  prod:
    build:
      context: .
      target: production
    container_name: country-catalog-prod
    ports:
      - "8080:80"
    restart: unless-stopped
